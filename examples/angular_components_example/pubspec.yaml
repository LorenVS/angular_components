name: ngcomponents_example
publish_to: none

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  ngdart: ^8.0.0-dev.1
  ngcomponents:
    path: ../../ngcomponents
  angular_gallery:
    path: ../../angular_gallery
  app_layout_example:
    path: ../app_layout_example
  build_config:
  material_button_example:
    path: ../material_button_example
  material_card_example:
    path: ../material_card_example
  material_checkbox_example:
    path: ../material_checkbox_example
  material_chips_example:
    path: ../material_chips_example
  material_datepicker_example:
    path: ../material_datepicker_example
  material_dialog_example:
    path: ../material_dialog_example
  material_expansionpanel_example:
    path: ../material_expansionpanel_example
  material_icon_example:
    path: ../material_icon_example
  material_input_example:
    path: ../material_input_example
  material_list_example:
    path: ../material_list_example
  material_menu_example:
    path: ../material_menu_example
  material_popup_example:
    path: ../material_popup_example
  material_progress_example:
    path: ../material_progress_example
  material_radio_example:
    path: ../material_radio_example
  material_select_example:
    path: ../material_select_example
  material_slider_example:
    path: ../material_slider_example
  material_spinner_example:
    path: ../material_spinner_example
  material_stepper_example:
    path: ../material_stepper_example
  material_tab_example:
    path: ../material_tab_example
  material_toggle_example:
    path: ../material_toggle_example
  material_tooltip_example:
    path: ../material_tooltip_example
  material_tree_example:
    path: ../material_tree_example
  material_yes_no_buttons_example:
    path: ../material_yes_no_buttons_example
  simple_html_example:
    path: ../simple_html_example
  scorecard_example:
    path: ../scorecard_example

dev_dependencies:
  build_runner: ^2.4.0
  build_web_compilers: ^4.5.0

# ngdart depends on build_modules as an unused pubspec dependency. Real
# build_modules ships a `module_library` builder that collides with the
# equivalent builder now bundled inside build_web_compilers (both auto-apply
# to every package and emit the same `.module.library` output), which makes
# build_runner fail with "Conflicting outputs". Nothing in this repo's
# dependency graph imports package:build_modules, so it's safe to replace it
# with an empty stand-in that has no build.yaml.
#
# observable (a dependency of ngcomponents) transitively depends on
# dart_internal, and no published dart_internal version both supports null
# safety and declares compatibility with recent Dart SDKs (the newest,
# 0.2.17, caps at `<3.13.0`). See
# tool/dart_internal_override/pubspec.yaml for details.
dependency_overrides:
  build_modules:
    path: ../../tool/build_modules_stub
  dart_internal:
    path: ../../tool/dart_internal_override
